name: Bump Build Number

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: bump-build-number-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Get number of commits in this PR
        id: commit-count
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          count=$(gh pr view "$PR_NUMBER" --json commits --jq '.commits | length')
          echo "commit_count=$count" >> "$GITHUB_OUTPUT"
          echo "→ Found $count commits in PR #$PR_NUMBER"

      - name: Bump version by commit count
        id: bump
        if: steps.commit-count.outputs.commit_count != '0'
        env:
          BUMP_BY: ${{ steps.commit-count.outputs.commit_count }}
        run: |
          set -euo pipefail

          FILE=".metadata/metadata.json"
          if [[ ! -f "$FILE" ]]; then
            echo "::error title=No metadata.json::'$FILE' does not exist, so there is no version to bump."
            exit 1
          fi

          OLD_VERSION=$(jq -r '.version // "0.0.0"' "$FILE")
          if [[ ! $OLD_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version::metadata.json carries version '$OLD_VERSION', which does not read X.Y.Z."
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$OLD_VERSION"
          new_patch=$((patch + BUMP_BY))
          NEW_VERSION="$major.$minor.$new_patch"

          echo "Bump: $OLD_VERSION → $NEW_VERSION (+$BUMP_BY)"

          jq --arg nv "$NEW_VERSION" '.version = $nv' "$FILE" > tmp.json && mv tmp.json "$FILE"

          echo "Checking localization files..."
          LOCALIZATION_FILE=""

          shopt -s nullglob
          for YAML_FILE in localization/english/*_mod_l_english.yml; do
            LOCALIZATION_FILE="$YAML_FILE"
            echo "→ Updating Mod Version in: $YAML_FILE"
            sed -i 's/Mod Version: [0-9]\+\.[0-9]\+\.[0-9]\+/Mod Version: '"$NEW_VERSION"'/' "$YAML_FILE"
            break
          done

          if [[ -z "$LOCALIZATION_FILE" ]]; then
            echo "ℹ️ No localization/english/*_mod_l_english.yml file found — skipping"
          else
            echo "✅ Localization file updated: $LOCALIZATION_FILE"
          fi

          {
            echo "new_version=$NEW_VERSION"
            echo "localization_file=$LOCALIZATION_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Commit & Push version bump
        if: steps.bump.outcome == 'success'
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT_COUNT: ${{ steps.commit-count.outputs.commit_count }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          LOCALIZATION_FILE: ${{ steps.bump.outputs.localization_file }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .metadata/metadata.json

          if [[ -n "$LOCALIZATION_FILE" && -f "$LOCALIZATION_FILE" ]]; then
            git add "$LOCALIZATION_FILE"
          fi

          if git diff --staged --quiet; then
            echo "No changes needed → Version remains the same"
            exit 0
          fi

          git commit -m "ci: bump patch by ${COMMIT_COUNT} → ${NEW_VERSION}"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt was rejected, rebasing onto the remote."
            sleep $(( attempt * 2 ))
            git pull --rebase --autostash origin "$BRANCH"
          done

          echo "::error title=Push failed::The version bump could not be pushed after 5 attempts."
          exit 1
