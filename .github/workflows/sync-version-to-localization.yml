name: Sync Version To Localization

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: sync-version-to-localization-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  sync-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Sync mod version from metadata.json into localization
        run: |
          set -euo pipefail

          FILE=".metadata/metadata.json"
          if [[ ! -f "$FILE" ]]; then
            echo "❌ $FILE not found"
            exit 1
          fi

          VERSION=$(jq -r '.version // empty' "$FILE")
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid or missing version in $FILE: '$VERSION'"
            exit 1
          fi
          echo "→ metadata.json version: $VERSION"

          GAME_VERSION=$(jq -r '.supported_game_version // empty' "$FILE")
          if [[ ! $GAME_VERSION =~ ^[0-9]+(\.([0-9]+|\*))*$ ]]; then
            echo "❌ Invalid or missing supported_game_version in $FILE: '$GAME_VERSION'"
            exit 1
          fi
          echo "→ metadata.json supported_game_version: $GAME_VERSION"

          shopt -s nullglob
          LOC_FILES=(localization/english/*_mod_l_english.yml)
          if [[ ${#LOC_FILES[@]} -eq 0 ]]; then
            echo "❌ No localization/english/*_mod_l_english.yml file found"
            exit 1
          fi

          for LOC in "${LOC_FILES[@]}"; do
            if grep -q 'Mod Version: [0-9]\+\.[0-9]\+\.[0-9]\+' "$LOC"; then
              # Only the 'Mod Version: X.Y.Z' marker is rewritten. The file's
              # UTF-8 BOM sits on line 1, which is never matched, so it is
              # preserved byte-for-byte.
              sed -i 's/Mod Version: [0-9]\+\.[0-9]\+\.[0-9]\+/Mod Version: '"$VERSION"'/' "$LOC"
              echo "→ Synced Mod Version in: $LOC"
            else
              echo "ℹ️ No 'Mod Version: X.Y.Z' marker in $LOC — skipping"
            fi

            if grep -q 'Game Version: [0-9][0-9.]*\*\?' "$LOC"; then
              # Same rule as above: only the marker is rewritten, and a
              # wildcard game version such as 1.13.* is carried through as
              # metadata.json states it.
              sed -i 's/Game Version: [0-9][0-9.]*\*\?/Game Version: '"$GAME_VERSION"'/' "$LOC"
              echo "→ Synced Game Version in: $LOC"
            else
              echo "ℹ️ No 'Game Version: X.Y.Z' marker in $LOC — skipping"
            fi
          done

      - name: Commit & push if changed
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull -r --autostash

          git add localization/english/*_mod_l_english.yml

          if git diff --staged --quiet; then
            echo "✅ Localization already in sync — nothing to commit."
          else
            git commit -m "ci: sync versions from metadata.json into localization"
            git push
          fi
