name: Create steam_desc from README

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: steam-desc-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  update-steam-desc:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout workflow scripts (My-Workflows)
        uses: actions/checkout@v6
        with:
          repository: salva133/My-Workflows
          ref: latest
          path: .workflow-scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Generate steam_desc.txt (Markdown → Steam BBCode)
        run: python3 .workflow-scripts/.github/scripts/md_to_bbcode.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull -r --autostash

          git add steam_desc.txt

          if git diff --staged --quiet; then
            echo "No changes - nothing to commit."
          else
            git commit -m "ci: update steam_desc.txt from README.md (BBCode)"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
