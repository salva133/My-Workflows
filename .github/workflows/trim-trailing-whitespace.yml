name: Trim Trailing Whitespace

on:
  workflow_call:
    inputs:
      paths:
        description: 'Folders to trim, separated by spaces or newlines. The default trims the whole repository.'
        type: string
        required: false
        default: '.'

permissions:
  contents: write

concurrency:
  group: trim-whitespace-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Remove trailing whitespace
        env:
          TRIM_PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          for DIR in $TRIM_PATHS; do
            git -C "$DIR" ls-files -z --cached --exclude-standard -- '*.txt' '*.yml' |
            (cd "$DIR" && xargs -0 --no-run-if-empty sed -i 's/[[:space:]]*$//')
          done

      - uses: stefanzweifel/git-auto-commit-action@28e16e81777b558cc906c8750092100bbb34c5e3 # v7.0.0
        with:
          commit_message: "style: trim trailing whitespace"
          branch: ${{ github.head_ref || github.ref_name }}
