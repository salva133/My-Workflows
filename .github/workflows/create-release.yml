name: Create Release

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      pr_number:
        required: true
        type: number
      pr_body:
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: create-release-${{ inputs.branch_name }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate branch naming convention
        id: validate
        env:
          BRANCH: ${{ inputs.branch_name }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH" =~ ^R(0[1-9]|[1-9][0-9])($|-|/) ]]; then
            echo "should_create=true" >> "$GITHUB_OUTPUT"
            echo "Branch name matches the convention: $BRANCH"
          else
            echo "should_create=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release Creation Skipped::"
            echo "Branch '$BRANCH' does **not** match the naming convention."
            echo "Allowed formats: R01, R02, R03..., R99, R01-feature, R99/hotfix etc."
            echo "Release will **not** be created."
          fi

      - name: Checkout code
        if: steps.validate.outputs.should_create == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Release
        if: steps.validate.outputs.should_create == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ github.token }}
          tag_name: "${{ inputs.branch_name }}"
          name: ${{ inputs.branch_name }}
          body: |
            Automated release from branch **${{ inputs.branch_name }}**
            
            Merged into `master` via PR #${{ inputs.pr_number }}
            
            ${{ inputs.pr_body }}
          draft: false
          prerelease: false
          generate_release_notes: true
