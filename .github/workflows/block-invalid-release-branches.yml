name: PR Merge Checks

on:
  workflow_call:
    inputs:
      head_ref:
        description: "Name of the head branch (github.head_ref)"
        required: true
        type: string
      base_ref:
        description: "Name of the base branch the PR targets (github.base_ref)"
        required: true
        type: string
      draft:
        description: "Whether the PR is a draft (github.event.pull_request.draft)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  block-draft-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check draft status
        env:
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          if [[ "$DRAFT" == "true" ]]; then
            echo "::error title=Draft pull request::This pull request is still a draft and must not be merged. Mark it as ready for review first."
            exit 1
          fi

          echo "PR is ready for review, merge is allowed."

  block-invalid-release-pr:
    if: inputs.draft == false && inputs.base_ref == 'master'

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check branch naming convention
        env:
          BRANCH: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^R(0[1-9]|[1-9][0-9])($|-|/) ]]; then
            echo "::error title=Invalid branch name::Branch '$BRANCH' is invalid. Allowed formats: R01...R99"
            echo "This pull request must **not** be merged into master!"
            echo ""
            echo "Allowed branches: R01, R02, ..., R99"
            echo "Current branch: $BRANCH"
            exit 1
          fi

          echo "Branch name OK: $BRANCH"
